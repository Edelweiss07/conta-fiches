<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conta Fiches</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#13110f; --panel:#1d1a17; --panel2:#262220; --line:#3a332d;
  --text:#f3ece1; --muted:#a89c8c; --gold:#e0b96a; --gold2:#b8903f;
  --felt:#1e5c40; --felt2:#13402c; --wood:#4a2f1c; --danger:#d9665b; --ok:#7cc48a;
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:radial-gradient(1200px 600px at 50% -10%,#2a2119 0%,var(--bg) 60%)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{opacity:.35;cursor:not-allowed}
input{font:inherit;color:var(--text)}
.num{font-family:Fraunces,Georgia,serif;font-variant-numeric:tabular-nums}

header{display:flex;align-items:center;gap:12px;padding:14px 20px;max-width:1180px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand h1{font-family:Fraunces,serif;font-weight:700;font-size:22px;margin:0;letter-spacing:.2px}
.brand .hand{font-size:13px;color:var(--muted);background:var(--panel2);border:1px solid var(--line);padding:3px 10px;border-radius:99px}
.hbtn{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-weight:600;font-size:14px}
.hbtn:hover:not(:disabled){border-color:var(--gold2)}
.hbtn svg{width:16px;height:16px}

main{max-width:1180px;margin:0 auto;padding:4px 20px 190px}

/* ---------- TABLE ---------- */
.arena{position:relative;height:min(74vh,660px);min-height:520px}
.felt{position:absolute;inset:11% 9%;border-radius:50%;
  background:radial-gradient(ellipse at 50% 40%,#2a7a55 0%,var(--felt) 45%,var(--felt2) 100%);
  border:16px solid var(--wood);
  box-shadow:0 0 0 3px #2b1a0f,0 0 0 5px #6b4a2c inset,0 30px 80px rgba(0,0,0,.55),inset 0 0 60px rgba(0,0,0,.45);
  display:flex;align-items:center;justify-content:center}
.felt::after{content:"";position:absolute;inset:18px;border-radius:50%;border:2px solid rgba(224,185,106,.18);pointer-events:none}

.pot{position:relative;z-index:1;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.stacks{display:flex;gap:8px;align-items:flex-end;height:64px;justify-content:center}
.stack{position:relative;width:34px}
.stack .c{position:absolute;left:0;width:34px;height:10px;border-radius:50%;box-shadow:0 1px 0 rgba(0,0,0,.45)}
.pot-label{font-size:12px;text-transform:uppercase;letter-spacing:2px;color:rgba(243,236,225,.7);font-weight:700}
.pot-amt{font-size:48px;font-weight:700;line-height:1;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.4)}
.pot-amt.pulse{animation:pulse .45s ease}
@keyframes pulse{40%{transform:scale(1.12);color:var(--gold)}}
.pot-sub{font-size:13px;color:rgba(243,236,225,.75);min-height:18px}
.pot-actions{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;justify-content:center}
.pbtn{padding:9px 16px;border-radius:99px;font-weight:700;font-size:14px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.18)}
.pbtn.gold{background:linear-gradient(180deg,var(--gold),var(--gold2));color:#2a1d0c;border:0;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.pbtn:hover:not(:disabled){filter:brightness(1.1)}

.seat{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);z-index:2;
  width:156px;padding:10px 12px 10px;border-radius:var(--radius);background:var(--panel);border:1.5px solid var(--line);
  text-align:left;display:grid;grid-template-columns:34px 1fr;column-gap:9px;row-gap:2px;align-items:center;
  box-shadow:0 10px 28px rgba(0,0,0,.4);transition:border-color .15s,transform .15s,opacity .15s}
.seat:hover{border-color:#5a4e42}
.seat.active{border-color:var(--gold);box-shadow:0 0 0 3px rgba(224,185,106,.25),0 10px 28px rgba(0,0,0,.45)}
.seat.folded{opacity:.45}
.seat.broke .chips{color:var(--danger)}
.avatar{grid-row:span 2;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#1a1410;font-size:15px}
.seat .name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.dealer{flex:none;width:18px;height:18px;border-radius:50%;background:#f3ece1;color:#1a1410;font-size:10px;font-weight:800;display:grid;place-items:center}
.seat .chips{font-size:20px;font-weight:700;line-height:1.1}
.seat .bet{grid-column:1/-1;margin-top:6px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;border-top:1px dashed var(--line);padding-top:6px}
.seat .bet b{color:var(--gold);font-weight:700}
.tag{font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}

/* ---------- ACTION BAR ---------- */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(22,19,17,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.bar-in{max-width:1180px;margin:0 auto;padding:12px 20px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.who{display:flex;align-items:center;gap:10px;min-width:170px}
.who .avatar{grid-row:auto}
.who .n{font-weight:800}
.who .s{font-size:13px;color:var(--muted)}
.chiprow{display:flex;gap:8px;flex-wrap:wrap}
.chip{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;position:relative;
  box-shadow:0 3px 0 rgba(0,0,0,.45),0 6px 14px rgba(0,0,0,.35);transition:transform .1s}
.chip::before{content:"";position:absolute;inset:4px;border-radius:50%;border:3px dashed rgba(255,255,255,.55)}
.chip span{position:relative;z-index:1;background:inherit;border-radius:50%;width:30px;height:30px;display:grid;place-items:center;box-shadow:inset 0 0 0 2px rgba(0,0,0,.15)}
.chip:active:not(:disabled){transform:translateY(2px)}
.custom{display:flex;gap:6px}
.custom input{width:92px;padding:10px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel2)}
.abtn{padding:11px 15px;border-radius:10px;font-weight:700;font-size:14px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.abtn:hover:not(:disabled){border-color:var(--gold2)}
.abtn.gold{background:linear-gradient(180deg,var(--gold),var(--gold2));color:#2a1d0c;border:0}
.abtn.red{color:#ffb3ab;border-color:#5e2e29}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.hint{color:var(--muted);font-size:14px;padding:12px 0}

/* ---------- SETUP ---------- */
.setup{max-width:560px;margin:30px auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:28px}
.setup h2,.modal h2{font-family:Fraunces,serif;margin:0 0 6px;font-size:26px}
.setup p.lead{color:var(--muted);margin:0 0 22px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
.field input,.inp{padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);width:100%}
.field input:focus,.inp:focus,.custom input:focus{outline:2px solid var(--gold2);outline-offset:-1px;border-color:transparent}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:40px;height:40px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:20px;font-weight:700}
.stepper .v{font-size:26px;width:44px;text-align:center}
.names{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.names .row{display:flex;align-items:center;gap:8px}
.names .dot{flex:none;width:12px;height:12px;border-radius:50%}
.big{width:100%;padding:14px;font-size:16px;margin-top:8px}

/* ---------- MODAL ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
.scrim.open{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;width:min(560px,100%);max-height:88vh;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal .mh{padding:22px 22px 8px}
.modal .mh p{margin:4px 0 0;color:var(--muted);font-size:14px}
.modal .mb{padding:8px 22px;overflow:auto}
.modal .mf{padding:14px 22px 20px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:8px}
.wrow{display:grid;grid-template-columns:auto 1fr 110px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #2c2622}
.wrow:last-child{border-bottom:0}
.wrow input[type=checkbox]{width:20px;height:20px;accent-color:var(--gold)}
.wrow .nm{display:flex;align-items:center;gap:8px;font-weight:600}
.wrow .nm small{color:var(--muted);font-weight:500}
.prow{display:grid;grid-template-columns:12px 1fr 110px 38px;gap:10px;align-items:center;padding:7px 0}
.prow .dot{width:12px;height:12px;border-radius:50%}
.xbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);color:var(--danger);font-size:18px}
.sumline{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);padding:10px 0 2px}
.sumline b{color:var(--text)}
.sumline .bad{color:var(--danger)}
.log{list-style:none;margin:0;padding:0}
.log li{padding:8px 0;border-bottom:1px solid #2c2622;font-size:14px;display:flex;gap:10px}
.log li .h{color:var(--muted);font-size:12px;min-width:54px;padding-top:2px}
.empty{color:var(--muted);padding:20px 0;text-align:center}
.flychip{position:fixed;z-index:60;width:26px;height:26px;border-radius:50%;pointer-events:none;box-shadow:0 0 0 3px rgba(255,255,255,.35) inset,0 4px 10px rgba(0,0,0,.5)}
.sep{height:1px;background:var(--line);margin:14px 0}

@media (max-width:780px){
  header{padding:12px 14px;flex-wrap:wrap}
  .hbtn .lbl{display:none}
  main{padding:4px 12px 250px}
  .arena{height:auto;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .felt{position:relative;inset:auto;grid-column:1/-1;border-radius:120px;min-height:230px;border-width:10px;padding:18px 10px;margin-bottom:6px}
  .felt::after{border-radius:100px;inset:10px}
  .pot-amt{font-size:42px}
  .seat{position:relative;left:auto;top:auto;transform:none;width:auto}
  .bar-in{padding:10px 12px 14px;gap:10px}
  .chip{width:46px;height:46px;font-size:13px}
  .chip span{width:26px;height:26px}
  .acts{margin-left:0;width:100%}
  .acts .abtn{flex:1}
  .names{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header id="hdr"></header>
<main id="app"></main>
<div class="bar" id="bar" hidden></div>
<div class="scrim" id="scrim"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>

<script>
const DENOMS=[1,5,10,25,100,500];
const CHIP={1:['#efe8da','#2b2b2b'],5:['#c8372d','#fff'],10:['#2c5fa8','#fff'],25:['#2f8a4e','#fff'],100:['#222','#e9d29a'],500:['#6b3fa0','#fff']};
const PCOLORS=['#e0a84f','#5fb0c9','#d9665b','#8fbf6a','#b48ad6','#e08fb4','#6fc4a8','#d6c35f','#7d93e0','#c98a5f'];
const KEY='contafiches-v1';
const $=s=>document.querySelector(s);
const fmt=n=>Number(n).toLocaleString('it-IT');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);

let S=load();
let undoStack=[];
let ui={active:null};
let setupDraft={count:4,start:1000,names:[]};

function load(){try{const v=localStorage.getItem(KEY);return v?JSON.parse(v):null}catch(e){return null}}
function save(){try{S?localStorage.setItem(KEY,JSON.stringify(S)):localStorage.removeItem(KEY)}catch(e){}}
function snap(){undoStack.push(JSON.stringify(S));if(undoStack.length>80)undoStack.shift()}
function undo(){if(!undoStack.length)return;S=JSON.parse(undoStack.pop());if(ui.active&&!S.players.find(p=>p.id===ui.active))ui.active=null;save();render()}
function log(m){S.log.unshift({h:S.hand,m});if(S.log.length>300)S.log.length=300}
const P=id=>S.players.find(p=>p.id===id);
const maxBet=()=>Math.max(0,...S.players.map(p=>p.bet));

/* ---------- RENDER ---------- */
function render(){renderHeader();S?renderTable():renderSetup()}

function renderHeader(){
  const ic={
    undo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>',
    users:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-4-6"/></svg>',
    list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>'
  };
  $('#hdr').innerHTML=`<div class="brand"><h1>Conta Fiches</h1>${S?`<span class="hand">Mano ${S.hand}</span>`:''}</div>
  ${S?`<button class="hbtn" data-act="undo" ${undoStack.length?'':'disabled'} title="Annulla ultima azione">${ic.undo}<span class="lbl">Annulla</span></button>
  <button class="hbtn" data-act="players">${ic.users}<span class="lbl">Giocatori</span></button>
  <button class="hbtn" data-act="log">${ic.list}<span class="lbl">Registro</span></button>`:''}`;
}

function renderSetup(){
  $('#bar').hidden=true;
  const d=setupDraft;
  while(d.names.length<d.count)d.names.push('');
  $('#app').innerHTML=`<div class="setup">
    <h2>Nuova partita</h2>
    <p class="lead">Scegli quanti giocatori siedono al tavolo e con quante fiches parte ciascuno.</p>
    <div class="field"><label>Giocatori</label>
      <div class="stepper"><button data-act="cnt" data-d="-1" ${d.count<=2?'disabled':''}>−</button><span class="v num">${d.count}</span><button data-act="cnt" data-d="1" ${d.count>=10?'disabled':''}>+</button></div></div>
    <div class="field"><label for="st">Fiches iniziali per giocatore</label><input id="st" type="number" min="1" inputmode="numeric" value="${d.start}"></div>
    <div class="field"><label>Nomi</label><div class="names">
      ${Array.from({length:d.count},(_,i)=>`<div class="row"><span class="dot" style="background:${PCOLORS[i]}"></span><input class="inp" data-name="${i}" placeholder="Giocatore ${i+1}" value="${esc(d.names[i]||'')}" maxlength="18"></div>`).join('')}
    </div></div>
    <button class="abtn gold big" data-act="start">Inizia la partita</button>
  </div>`;
}

function seatPos(i,n){
  const a=Math.PI/2+2*Math.PI*i/n;
  return {x:50+44*Math.cos(a),y:50+42*Math.sin(a)};
}

function stacksHTML(total){
  let rest=total,out=[];
  for(const d of [...DENOMS].reverse()){const c=Math.floor(rest/d);if(c>0){out.push([d,c]);rest-=c*d}}
  out=out.slice(0,6).reverse();
  return out.map(([d,c])=>{const k=Math.min(c,9);let h='';for(let j=0;j<k;j++)h+=`<span class="c" style="bottom:${j*5}px;background:${CHIP[d][0]};border:2px dashed ${d===1?'#999':'rgba(255,255,255,.5)'}"></span>`;return `<div class="stack" style="height:${10+(k-1)*5}px" title="${c} × ${d}">${h}</div>`}).join('');
}

function renderTable(){
  const n=S.players.length, mb=maxBet();
  const seats=S.players.map((p,i)=>{
    const {x,y}=seatPos(i,n);
    const cls=['seat',ui.active===p.id&&'active',p.folded&&'folded',p.chips===0&&'broke'].filter(Boolean).join(' ');
    return `<button class="${cls}" data-act="sel" data-id="${p.id}" style="--x:${x}%;--y:${y}%">
      <span class="avatar" style="background:${p.color}">${esc((p.name[0]||'?').toUpperCase())}</span>
      <span class="name">${esc(p.name)}${S.dealer===i?'<span class="dealer" title="Mazziere">D</span>':''}</span>
      <span class="chips num">${fmt(p.chips)}</span>
      <span class="bet">${p.folded?'<span class="tag">Passato</span>':p.chips===0&&p.bet>0?'<span class="tag">All-in</span>':'<span>In piatto</span>'}<b class="num">${fmt(p.bet)}</b></span>
    </button>`}).join('');
  const contributors=S.players.filter(p=>p.bet>0).length;
  const carried=S.pot-S.players.reduce((a,p)=>a+p.bet,0);
  $('#app').innerHTML=`<div class="arena">
    <div class="felt"><div class="pot">
      <div class="stacks">${stacksHTML(S.pot)}</div>
      <div class="pot-label">Piatto</div>
      <div class="pot-amt num" id="potAmt">${fmt(S.pot)}</div>
      <div class="pot-sub">${S.pot?`${contributors} ${contributors===1?'giocatore':'giocatori'}${mb?` · puntata max ${fmt(mb)}`:''}${carried>0?` · ${fmt(carried)} riportate`:''}`:'Nessuna fiche in gioco'}</div>
      <div class="pot-actions">
        <button class="pbtn gold" data-act="award" ${S.pot?'':'disabled'}>Assegna piatto</button>
        <button class="pbtn" data-act="newhand">Nuova mano</button>
      </div>
    </div></div>
    ${seats}
  </div>`;
  renderBar();
}

function renderBar(){
  const bar=$('#bar');bar.hidden=false;
  const p=ui.active&&P(ui.active);
  if(!p){bar.innerHTML=`<div class="bar-in"><div class="hint">Tocca un giocatore per puntare le sue fiches nel piatto.</div></div>`;return}
  const toCall=Math.max(0,maxBet()-p.bet);
  const dis=p.folded||p.chips===0;
  bar.innerHTML=`<div class="bar-in">
    <div class="who"><span class="avatar" style="background:${p.color}">${esc((p.name[0]||'?').toUpperCase())}</span>
      <div><div class="n">${esc(p.name)}</div><div class="s"><span class="num">${fmt(p.chips)}</span> fiches${p.folded?' · passato':''}</div></div></div>
    <div class="chiprow">${DENOMS.map(d=>`<button class="chip num" data-act="bet" data-v="${d}" style="background:${CHIP[d][0]};color:${CHIP[d][1]}" ${dis||d>p.chips?'disabled':''} title="Punta ${d}"><span>${d}</span></button>`).join('')}</div>
    <form class="custom" data-form="custom"><input id="cust" type="number" min="1" inputmode="numeric" placeholder="Importo" ${dis?'disabled':''}><button class="abtn" ${dis?'disabled':''}>Punta</button></form>
    <div class="acts">
      ${toCall>0?`<button class="abtn gold" data-act="call" ${dis?'disabled':''}>Vedi ${fmt(Math.min(toCall,p.chips))}</button>`:''}
      <button class="abtn" data-act="allin" ${dis?'disabled':''}>All-in</button>
      <button class="abtn ${p.folded?'':'red'}" data-act="fold">${p.folded?'Rientra':'Passa'}</button>
    </div>
  </div>`;
}

/* ---------- ACTIONS ---------- */
function bet(amount){
  const p=P(ui.active);if(!p||p.folded)return;
  const amt=Math.min(Math.floor(amount),p.chips);if(!(amt>0))return;
  const from=document.querySelector(`.seat[data-id="${p.id}"]`)?.getBoundingClientRect();
  snap();
  p.chips-=amt;p.bet+=amt;S.pot+=amt;
  log(`${p.name} punta ${fmt(amt)}${p.chips===0?' (all-in)':''}`);
  save();render();
  const to=$('#potAmt');to.classList.remove('pulse');void to.offsetWidth;to.classList.add('pulse');
  if(from)fly(from,to.getBoundingClientRect(),p.color);
}

function fly(a,b,color){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const el=document.createElement('div');el.className='flychip';el.style.background=color;
  const x0=a.left+a.width/2-13,y0=a.top+a.height/2-13,x1=b.left+b.width/2-13,y1=b.top+b.height/2-13;
  el.style.left=x0+'px';el.style.top=y0+'px';document.body.appendChild(el);
  el.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${(x1-x0)/2}px,${(y1-y0)/2-40}px) scale(1.15)`,opacity:1,offset:.5},{transform:`translate(${x1-x0}px,${y1-y0}px) scale(.6)`,opacity:.2}],{duration:520,easing:'cubic-bezier(.4,.1,.3,1)'}).onfinish=()=>el.remove();
}

function startHand(){
  S.players.forEach(p=>{p.bet=0;p.folded=false});
  S.hand++;
  const n=S.players.length;
  if(n){let d=S.dealer;for(let k=1;k<=n;k++){const j=(S.dealer+k)%n;if(S.players[j].chips>0){d=j;break}}S.dealer=d}
  log(`— Inizia la mano ${S.hand}${S.pot?` (piatto riportato: ${fmt(S.pot)})`:''}`);
}

/* ---------- MODALS ---------- */
function openModal(html,onMount){$('#modal').innerHTML=html;$('#scrim').classList.add('open');onMount&&onMount($('#modal'))}
function closeModal(){$('#scrim').classList.remove('open');$('#modal').innerHTML=''}

function awardModal(){
  const pot=S.pot;
  const order=[...S.players].sort((a,b)=>(a.folded-b.folded));
  openModal(`<div class="mh"><h2>Assegna il piatto</h2><p>Seleziona chi vince: il piatto viene diviso in parti uguali. Puoi correggere gli importi a mano (per esempio con un piatto laterale).</p></div>
  <div class="mb">${order.map(p=>`<div class="wrow">
      <input type="checkbox" data-w="${p.id}" aria-label="${esc(p.name)}">
      <span class="nm"><span class="avatar" style="width:26px;height:26px;font-size:12px;background:${p.color}">${esc((p.name[0]||'?').toUpperCase())}</span>${esc(p.name)} <small>${p.folded?'passato':'in piatto '+fmt(p.bet)}</small></span>
      <input class="inp num" type="number" min="0" inputmode="numeric" data-amt="${p.id}" placeholder="0">
    </div>`).join('')}
    <div class="sumline"><span>Piatto <b class="num">${fmt(pot)}</b></span><span id="asum"></span></div>
  </div>
  <div class="mf"><button class="abtn" data-m="close">Annulla</button><button class="abtn" data-m="all">Tutto al primo selezionato</button><button class="abtn gold" data-m="ok">Conferma</button></div>`,
  m=>{
    const boxes=[...m.querySelectorAll('[data-w]')], amts=id=>m.querySelector(`[data-amt="${id}"]`);
    const split=()=>{const ch=boxes.filter(b=>b.checked);m.querySelectorAll('[data-amt]').forEach(i=>i.value='');
      if(ch.length){const q=Math.floor(pot/ch.length);let r=pot-q*ch.length;ch.forEach(b=>{amts(b.dataset.w).value=q+(r>0?1:0);if(r>0)r--})}upd()};
    const total=()=>[...m.querySelectorAll('[data-amt]')].reduce((a,i)=>a+Math.max(0,Math.floor(+i.value||0)),0);
    const upd=()=>{const t=total(),left=pot-t;$('#asum').innerHTML=t>pot?`<span class="bad">Supera il piatto di ${fmt(t-pot)}</span>`:`Assegnate <b class="num">${fmt(t)}</b>${left>0&&t>0?` · restano ${fmt(left)}`:''}`;m.querySelector('[data-m=ok]').disabled=!(t>0&&t<=pot)};
    boxes.forEach(b=>b.addEventListener('change',split));
    m.querySelectorAll('[data-amt]').forEach(i=>i.addEventListener('input',()=>{m.querySelector(`[data-w="${i.dataset.amt}"]`).checked=(+i.value>0);upd()}));
    m.querySelector('[data-m=all]').onclick=()=>{const f=boxes.find(b=>b.checked)||boxes[0];boxes.forEach(b=>b.checked=b===f);m.querySelectorAll('[data-amt]').forEach(i=>i.value='');amts(f.dataset.w).value=pot;upd()};
    m.querySelector('[data-m=close]').onclick=closeModal;
    m.querySelector('[data-m=ok]').onclick=()=>{
      const t=total();if(!(t>0&&t<=pot))return;
      snap();
      const potRect=$('#potAmt').getBoundingClientRect();const winners=[];
      m.querySelectorAll('[data-amt]').forEach(i=>{const v=Math.floor(+i.value||0);if(v>0){const p=P(i.dataset.amt);p.chips+=v;winners.push(p);log(`${p.name} vince ${fmt(v)}`)}});
      S.pot-=t;
      if(S.pot===0)startHand();else log(`Restano ${fmt(S.pot)} nel piatto`);
      closeModal();save();render();
      winners.forEach(p=>{const s=document.querySelector(`.seat[data-id="${p.id}"]`);s&&fly(potRect,s.getBoundingClientRect(),'#e0b96a')});
    };
    upd();
  });
}

function newHandModal(){
  if(!S.pot){snap();startHand();save();render();return}
  const bets=S.players.reduce((a,p)=>a+p.bet,0);
  openModal(`<div class="mh"><h2>Nuova mano</h2><p>Nel piatto ci sono ancora <b class="num">${fmt(S.pot)}</b> fiches. Cosa vuoi farne?</p></div>
  <div class="mf"><button class="abtn" data-m="close">Annulla</button>
  ${bets?`<button class="abtn" data-m="refund">Restituisci le puntate</button>`:''}
  <button class="abtn gold" data-m="carry">Riporta alla prossima mano</button></div>`,m=>{
    m.querySelector('[data-m=close]').onclick=closeModal;
    m.querySelector('[data-m=carry]').onclick=()=>{snap();startHand();closeModal();save();render()};
    const r=m.querySelector('[data-m=refund]');
    if(r)r.onclick=()=>{snap();S.players.forEach(p=>{if(p.bet){p.chips+=p.bet;S.pot-=p.bet}});log('Puntate restituite ai giocatori');startHand();closeModal();save();render()};
  });
}

function playersModal(){
  const draft=S.players.map(p=>({...p}));
  const draw=m=>{
    m.querySelector('#plist').innerHTML=draft.map((p,i)=>`<div class="prow"><span class="dot" style="background:${p.color}"></span>
      <input class="inp" data-pn="${i}" value="${esc(p.name)}" maxlength="18" aria-label="Nome">
      <input class="inp num" data-pc="${i}" type="number" min="0" inputmode="numeric" value="${p.chips}" aria-label="Fiches">
      <button class="xbtn" data-px="${i}" ${draft.length<=2?'disabled':''} title="Rimuovi">×</button></div>`).join('');
    m.querySelector('[data-m=add]').disabled=draft.length>=10;
  };
  openModal(`<div class="mh"><h2>Giocatori</h2><p>Modifica nomi e fiches (ricariche, correzioni), aggiungi o togli giocatori.</p></div>
  <div class="mb"><div class="prow" style="color:var(--muted);font-size:12px;font-weight:700"><span></span><span>Nome</span><span>Fiches</span><span></span></div>
    <div id="plist"></div>
    <button class="abtn" data-m="add" style="margin-top:8px">+ Aggiungi giocatore</button>
    <div class="sep"></div>
    <button class="abtn red" data-m="reset">Ricomincia da capo</button>
  </div>
  <div class="mf"><button class="abtn" data-m="close">Annulla</button><button class="abtn gold" data-m="ok">Salva</button></div>`,m=>{
    draw(m);
    m.addEventListener('input',e=>{const t=e.target;if(t.dataset.pn!=null)draft[t.dataset.pn].name=t.value;if(t.dataset.pc!=null)draft[t.dataset.pc].chips=Math.max(0,Math.floor(+t.value||0))});
    m.addEventListener('click',e=>{const x=e.target.closest('[data-px]');if(x){draft.splice(+x.dataset.px,1);draw(m)}});
    m.querySelector('[data-m=add]').onclick=()=>{const used=new Set(draft.map(p=>p.color));draft.push({id:uid(),name:`Giocatore ${draft.length+1}`,chips:S.start,color:PCOLORS.find(c=>!used.has(c))||PCOLORS[draft.length%10],folded:false,bet:0});draw(m);m.querySelector(`[data-pn="${draft.length-1}"]`).select()};
    m.querySelector('[data-m=close]').onclick=closeModal;
    m.querySelector('[data-m=reset]').onclick=()=>confirmReset();
    m.querySelector('[data-m=ok]').onclick=()=>{
      snap();
      const old=new Map(S.players.map(p=>[p.id,p]));
      draft.forEach((p,i)=>{p.name=p.name.trim()||`Giocatore ${i+1}`;const o=old.get(p.id);
        if(!o)log(`${p.name} si siede al tavolo con ${fmt(p.chips)}`);
        else{if(o.chips!==p.chips)log(`${p.name}: fiches ${fmt(o.chips)} → ${fmt(p.chips)}`);if(o.name!==p.name)log(`${o.name} ora si chiama ${p.name}`)}});
      old.forEach((o,id)=>{if(!draft.find(p=>p.id===id))log(`${o.name} lascia il tavolo`)});
      S.players=draft;if(S.dealer>=draft.length)S.dealer=0;
      if(ui.active&&!P(ui.active))ui.active=null;
      closeModal();save();render();
    };
  });
}

function confirmReset(){
  openModal(`<div class="mh"><h2>Ricominciare?</h2><p>La partita in corso, il piatto e il registro verranno cancellati.</p></div>
  <div class="mf"><button class="abtn" data-m="close">Annulla</button><button class="abtn red" data-m="ok">Sì, ricomincia</button></div>`,m=>{
    m.querySelector('[data-m=close]').onclick=closeModal;
    m.querySelector('[data-m=ok]').onclick=()=>{setupDraft={count:S.players.length,start:S.start,names:S.players.map(p=>p.name)};S=null;undoStack=[];ui.active=null;save();closeModal();render()};
  });
}

function logModal(){
  openModal(`<div class="mh"><h2>Registro</h2><p>Tutte le azioni della partita, dalla più recente.</p></div>
  <div class="mb">${S.log.length?`<ul class="log">${S.log.map(l=>`<li><span class="h">Mano ${l.h}</span><span>${esc(l.m)}</span></li>`).join('')}</ul>`:'<div class="empty">Ancora nessuna azione.</div>'}</div>
  <div class="mf"><button class="abtn gold" data-m="close">Chiudi</button></div>`,m=>{m.querySelector('[data-m=close]').onclick=closeModal});
}

/* ---------- EVENTS ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act;
  if(a==='cnt'){setupDraft.count=Math.min(10,Math.max(2,setupDraft.count+ +b.dataset.d));renderSetup()}
  else if(a==='start'){
    const d=setupDraft,start=Math.max(1,Math.floor(+$('#st').value||0));
    const names=Array.from({length:d.count},(_,i)=>(d.names[i]||'').trim()||`Giocatore ${i+1}`);
    S={players:names.map((n,i)=>({id:uid(),name:n,chips:start,color:PCOLORS[i],folded:false,bet:0})),pot:0,hand:1,dealer:0,start,log:[]};
    log(`— Partita iniziata: ${names.length} giocatori, ${fmt(start)} fiches ciascuno`);
    ui.active=S.players[1%names.length].id;save();render();
  }
  else if(a==='sel'){ui.active=ui.active===b.dataset.id?null:b.dataset.id;renderTable()}
  else if(a==='bet')bet(+b.dataset.v);
  else if(a==='call'){const p=P(ui.active);bet(maxBet()-p.bet)}
  else if(a==='allin'){const p=P(ui.active);bet(p.chips)}
  else if(a==='fold'){const p=P(ui.active);snap();p.folded=!p.folded;log(`${p.name} ${p.folded?'passa':'rientra in gioco'}`);save();render()}
  else if(a==='award')awardModal();
  else if(a==='newhand')newHandModal();
  else if(a==='undo')undo();
  else if(a==='players')playersModal();
  else if(a==='log')logModal();
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.name!=null)setupDraft.names[t.dataset.name]=t.value;
  if(t.id==='st')setupDraft.start=t.value;
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.dataset.form==='custom'){const v=+$('#cust').value;if(v>0)bet(v)}
});
$('#scrim').addEventListener('click',e=>{if(e.target.id==='scrim')closeModal()});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeModal();
  if((e.ctrlKey||e.metaKey)&&e.key==='z'&&!$('#scrim').classList.contains('open')){e.preventDefault();undo()}
});
window.addEventListener('resize',()=>{});
render();
</script>
</body>
</html>
